name: capstone-legacy

services:
  web:
    build: .
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    environment:
      DB_HOST: db
      DB_NAME: testwsqlnew
      DB_USER: capstone
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Use the test connection and disabled email pages.
      - ./docker/conn:/var/www/html/testwsqlnew/conn:ro
      - ./docker/mail/sendmail.php:/var/www/html/testwsqlnew/sendmail.php:ro
      - ./docker/mail/sendresultmail.php:/var/www/html/testwsqlnew/sendresultmail.php:ro

  db:
    image: mysql:8.4
    # Match the legacy system's mixed-case table names.
    command: ["--lower-case-table-names=1"]
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE: testwsqlnew
      MYSQL_USER: capstone
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # Wait for TCP access and an initialized application table.
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql
          --protocol=TCP -h127.0.0.1 -u"$${MYSQL_USER}"
          "$${MYSQL_DATABASE}" -e "SELECT 1 FROM exam LIMIT 1;"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  db_data: